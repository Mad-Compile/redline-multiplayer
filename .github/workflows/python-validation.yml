name: REDLINE Python validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux window test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libmtdev1
      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py redline
      - name: Import the Kivy application modules
        env:
          KIVY_NO_ARGS: "1"
        run: xvfb-run -a python -c "from redline.app import RedlineApp; from redline.menu import MainMenu; from redline.settings import SettingsScreen; print('REDLINE Kivy modules imported')"
      - name: Instantiate the image-backed menu under a virtual display
        env:
          KIVY_NO_ARGS: "1"
        run: |
          xvfb-run -a python - <<'PY'
          from pathlib import Path
          from kivy.app import App
          from kivy.clock import Clock
          from redline.menu import MainMenu

          class MenuSmokeApp(App):
              def build(self):
                  menu = MainMenu()
                  print("MENU_DIAGNOSTICS", len(menu.children), menu._background_image.source, [child.__class__.__name__ for child in menu.children])
                  assert len(menu.children) == 8, f"Expected background, bottom scrim, 3 artwork buttons and 3 branding labels, got {len(menu.children)}"
                  assert any(getattr(child, "text", "") == "REDLINE" for child in menu.children), "REDLINE title is missing"
                  assert sum(child.__class__.__name__ == "Label" for child in menu.children) == 3, "Expected title, subtitle and footer labels"
                  assert str(menu._background_image.source).endswith("background.png"), f"Background was not converted to PNG: {menu._background_image.source!r}"
                  assert Path(menu._background_image.source).is_file(), "Converted background PNG is missing"
                  artwork_buttons = [child for child in menu.children if child.__class__.__name__ == "ArtworkButton"]
                  assert len(artwork_buttons) == 3, "Expected exactly three original artwork buttons"
                  assert all(child.source.endswith(".png") and Path(child.source).is_file() for child in artwork_buttons), "Every startup button must use a decoded PNG cache"
                  return menu

          app = MenuSmokeApp()
          Clock.schedule_once(lambda _dt: app.stop(), 0.5)
          app.run()
          PY

      - name: Instantiate and exercise the illustrated settings screen
        env:
          KIVY_NO_ARGS: "1"
        run: |
          xvfb-run -a python - <<'PY'
          from pathlib import Path
          from kivy.app import App
          from kivy.clock import Clock
          from redline.menu import MainMenu
          from redline.settings import SettingsScreen, SELECT_OPTIONS, load_preferences

          class SettingsSmokeApp(App):
              def build(self):
                  menu = MainMenu()
                  screen = SettingsScreen(
                      on_back=lambda: None,
                      click_sound=menu._click_sound,
                      audio_callback=menu._apply_audio_settings,
                  )
                  assert set(screen._selectors) == set(SELECT_OPTIONS)
                  assert all(Path(path).is_file() for path in screen._ui_paths.values())
                  assert len(screen._selectors) == 5
                  screen._step_setting("shadows", -1)
                  assert screen.preferences["shadows"] == "Low"
                  screen._set_volume("master_volume", 0.37)
                  restored = load_preferences(screen._settings_path)
                  assert restored["shadows"] == "Low"
                  assert abs(restored["master_volume"] - 0.37) < 0.001
                  print("REDLINE settings instantiated: 3 sliders, 5 selectors, persistent preferences")
                  return screen

          app = SettingsSmokeApp()
          Clock.schedule_once(lambda _dt: app.stop(), 0.5)
          app.run()
          PY

      - name: Instantiate the supplied MAP 01 viewer under a virtual display
        env:
          KIVY_NO_ARGS: "1"
        run: |
          xvfb-run -a python - <<'PY'
          from redline.gameplay.map_data import load_map_layout
          from redline.gameplay.map_screen import MapScreen

          layout = load_map_layout()
          screen = MapScreen(on_back=lambda: None)
          assert len(layout["scenes"]) == 39
          assert len(screen.map_canvas.children) == 39
          print("MAP 01 viewer instantiated with all 39 authored locations")
          PY
      - name: Exercise actual menu navigation under a virtual display
        env:
          KIVY_NO_ARGS: "1"
        run: |
          xvfb-run -a python - <<'PY'
          from redline.app import RedlineApp
          from redline.menu import ArtworkButton
          from redline.gameplay.explore_screen import ExploreScreen

          app = RedlineApp()
          manager = app.build()
          app.root = manager
          assert manager.current == "menu"
          menu = manager.get_screen("menu").children[0]
          buttons = [child for child in menu.children if isinstance(child, ArtworkButton)]
          assert len(buttons) == 3, f"Expected Practice, Start Match and Settings buttons; got {len(buttons)}"

          practice = next(button for button in buttons if button.source == menu._art_paths["practice"])
          start_match = next(button for button in buttons if button.source == menu._art_paths["match"])
          settings = next(button for button in buttons if button.source == menu._art_paths["settings"])

          practice.trigger_action(0)
          assert manager.current == "explore", "Practice tap did not open exploration"
          first_explore = manager.get_screen("explore").children[0]
          assert isinstance(first_explore, ExploreScreen)
          first_explore.on_back()
          assert manager.current == "menu", "Explore MENU button did not return to menu"
          first_explore.world._clock.cancel()

          start_match.trigger_action(0)
          assert manager.current == "explore", "Start Match tap did not open exploration"
          second_explore = manager.get_screen("explore").children[0]
          assert isinstance(second_explore, ExploreScreen)
          second_explore.on_back()
          assert manager.current == "menu", "Start Match exploration could not return to menu"
          second_explore.world._clock.cancel()

          settings.trigger_action(0)
          assert manager.current == "settings", "Settings gear tap did not open settings"
          manager.get_screen("settings").children[0]._go_back()
          assert manager.current == "menu", "Settings back button did not return to menu"
          print("PASS: Practice, Start Match, Settings and both back paths switch visible screens.")
          PY

      - name: Run gameplay and supplied-art tests
        run: python -m pytest -q
