name: REDLINE Python validation

on:
  push:
    branches:
      - "python/**"
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux window test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libmtdev1
      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py redline
      - name: Import the Kivy application modules
        env:
          KIVY_NO_ARGS: "1"
        run: xvfb-run -a python -c "from redline.app import RedlineApp; from redline.menu import MainMenu; print('REDLINE Kivy modules imported')"
      - name: Instantiate the image-backed menu under a virtual display
        env:
          KIVY_NO_ARGS: "1"
        run: |
          xvfb-run -a python - <<'PY'
          from kivy.app import App
          from kivy.clock import Clock
          from redline.menu import MainMenu

          class MenuSmokeApp(App):
              def build(self):
                  menu = MainMenu()
                  print("MENU_DIAGNOSTICS", len(menu.children), menu._background_image.source, [child.__class__.__name__ for child in menu.children])
                  assert len(menu.children) == 4, f"Expected background plus 3 buttons, got {len(menu.children)}"
                  assert str(menu._background_image.source).endswith("menu_background.webp"), f"Unexpected background source: {menu._background_image.source!r}"
                  assert sum(child.__class__.__name__ == "ArtworkButton" for child in menu.children) == 3, "Expected exactly three original artwork buttons"
                  return menu

          app = MenuSmokeApp()
          Clock.schedule_once(lambda _dt: app.stop(), 0.5)
          app.run()
          PY

      - name: Instantiate the supplied MAP 01 viewer under a virtual display
        env:
          KIVY_NO_ARGS: "1"
        run: |
          xvfb-run -a python - <<'PY'
          from redline.gameplay.map_data import load_map_layout
          from redline.gameplay.map_screen import MapScreen

          layout = load_map_layout()
          screen = MapScreen(on_back=lambda: None)
          assert len(layout["scenes"]) == 39
          assert len(screen.map_canvas.children) == 39
          print("MAP 01 viewer instantiated with all 39 authored locations")
          PY
      - name: Run gameplay and supplied-art tests
        run: python -m pytest -q
