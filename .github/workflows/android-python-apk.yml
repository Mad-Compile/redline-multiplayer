name: REDLINE Android APK and startup smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  P4A_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Buildozer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev gettext autopoint

      - name: Install Buildozer toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0" "Cython==0.29.34"
          buildozer --version
          java -version

      - name: Cache Android SDK, NDK and Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-redline-android-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-redline-android-

      - name: Build arm64 and x86_64 debug APKs
        run: |
          yes | buildozer -v android debug

      - name: Verify universal Android APK output
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find bin -maxdepth 1 -type f -name '*arm64-v8a_x86_64*debug.apk' -print -quit)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          sha256sum "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload universal Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-Android-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  android-startup-smoke:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download universal Android test APK
        uses: actions/download-artifact@v4
        with:
          name: REDLINE-Android-debug
          path: emulator-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch REDLINE in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android-startup-smoke.sh

      - name: Upload Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-Android-startup-diagnostics
          path: ${{ github.workspace }}/android-startup-diagnostics/
          if-no-files-found: warn
          retention-days: 7
