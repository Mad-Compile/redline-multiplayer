name: REDLINE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "python/kivy-migration"
    tags:
      - "python-v*"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  P4A_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out Python migration
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Buildozer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev gettext autopoint

      - name: Install Buildozer toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0" "Cython==0.29.34"
          buildozer --version
          java -version

      - name: Cache Android SDK, NDK and Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-redline-android-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-redline-android-

      - name: Build debug APK
        run: |
          yes | buildozer -v android debug

      - name: Verify APK output
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          sha256sum "$APK_PATH"
          ls -lh "$APK_PATH"
          echo "### Android APK build succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: `$(basename "$APK_PATH")`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-Android-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
