name: REDLINE Android APK (map source branch)

on:
  push:
    branches:
      - map/rail-yard-foundation
    paths:
      - ".github/workflows/android-apk.yml"
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "resources/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the source branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Download Godot 4.7.2 and matching Android templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          GODOT_DIR="$RUNNER_TEMP/godot"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$GODOT_DIR" "$TEMPLATE_DIR"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output "$GODOT_DIR/godot.zip"
          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          chmod +x "$GODOT_DIR/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$GODOT_DIR/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            --output "$GODOT_DIR/templates.tpz"
          mkdir -p "$GODOT_DIR/templates"
          unzip -q "$GODOT_DIR/templates.tpz" -d "$GODOT_DIR/templates"
          if [ -d "$GODOT_DIR/templates/templates" ]; then
            cp -a "$GODOT_DIR/templates/templates/." "$TEMPLATE_DIR/"
          else
            cp -a "$GODOT_DIR/templates/." "$TEMPLATE_DIR/"
          fi
          printf "4.7.2.stable" > "$TEMPLATE_DIR/version.txt"

      - name: Configure Android SDK paths for Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF2

      - name: Import resources and parse project
        run: '"$GODOT_BIN" --headless --editor --path . --quit'

      - name: Smoke test the main scene
        run: '"$GODOT_BIN" --headless --path . --quit-after 5'

      - name: Export arm64 Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug \
            "Android Debug APK" build/REDLINE_Terminal09_v0.1.0_debug.apk

      - name: Verify APK package and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="build/REDLINE_Terminal09_v0.1.0_debug.apk"
          test -s "$APK"
          APP_ID="$(apkanalyzer manifest application-id "$APK")"
          test "$APP_ID" = "com.madcompile.redline"
          apkanalyzer manifest permissions "$APK" | grep -Fx "android.permission.INTERNET"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'
          echo "APK_SIZE_BYTES=$(stat -c '%s' "$APK")" >> "$GITHUB_ENV"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-Terminal09-MapFoundation-Android-Debug
          path: build/REDLINE_Terminal09_v0.1.0_debug.apk
          if-no-files-found: error
          retention-days: 14
